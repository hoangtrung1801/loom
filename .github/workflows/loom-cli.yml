name: loom CLI

on:
  workflow_dispatch:
  push:
    tags:
      - 'loom-v*'
  pull_request:
    paths:
      - 'loom-heart/cmd/loom/**'
      - '.github/workflows/loom-cli.yml'

permissions:
  contents: read

jobs:
  build-linux:
    name: build (linux-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            arch: amd64
            tantivy: linux-amd64-musl
          - os: ubuntu-24.04-arm
            arch: arm64
            tantivy: linux-arm64-musl
    defaults:
      run:
        working-directory: loom-heart
    env:
      GOPRIVATE: github.com/anyproto
      GOTOOLCHAIN: local
    steps:
      # Only needed if a dependency is private; skipped when the secret is absent
      # (e.g. pull requests from forks) so public modules still download.
      - name: git config
        working-directory: .
        env:
          ANYTYPE_PAT: ${{ secrets.ANYTYPE_PAT }}
        run: |
          if [ -n "$ANYTYPE_PAT" ]; then
            git config --global url."https://${ANYTYPE_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: loom-heart/go.mod

      # tantivy-go links prebuilt Rust static libs (cgo), so a plain
      # CGO_ENABLED=0 cross-compile is impossible. Fetch + sha256-verify them.
      - name: Fetch tantivy libs
        run: make check-tantivy-version

      # Build inside Alpine: its gcc and libgcc are musl-native, which the
      # prebuilt musl tantivy libs need for a static link. (Ubuntu's musl-gcc
      # wrapper pulls in glibc's libgcc_eh and fails with _dl_find_object.)
      # The container is arch-native on each runner, so no cross toolchain.
      - name: Build loom
        working-directory: .
        run: |
          docker run --rm \
            -v "$PWD":/src -w /src/loom-heart \
            -e CGO_ENABLED=1 -e GOTOOLCHAIN=auto -e GOPRIVATE=github.com/anyproto \
            -e CGO_LDFLAGS="-L/src/loom-heart/deps/libs/${{ matrix.tantivy }}" \
            -e GOFLAGS=-buildvcs=false \
            golang:1.26-alpine sh -ec '
              apk add --no-cache build-base git
              # Tags/flags mirror makefiles/ci-cross-compile-library.mk (linux targets).
              # Alpine gcc defaults to PIE, which turns -static into a static-pie link that
              # rejects the non-PIC Go objects ("read-only segment has dynamic relocations"),
              # so ask for a plain static executable with -no-pie.
              go build \
                -tags="nographviz nowatchdog nosigar nomutexdeadlockdetector noheic" \
                -ldflags="-linkmode external -extldflags \"-static -no-pie -Wl,-z,stack-size=1000000\"" \
                -o loom ./cmd/loom
              chown '"$(id -u):$(id -g)"' loom
            '

      - name: Smoke test
        run: |
          file loom
          ./loom --help

      - name: Package
        run: |
          name=loom-linux-${{ matrix.arch }}
          tar -czf "$name.tar.gz" loom
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loom-linux-${{ matrix.arch }}
          path: |
            loom-heart/loom-linux-${{ matrix.arch }}.tar.gz
            loom-heart/loom-linux-${{ matrix.arch }}.tar.gz.sha256

  build-macos:
    name: build (darwin-${{ matrix.arch }})
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: amd64
    defaults:
      run:
        working-directory: loom-heart
    env:
      GOPRIVATE: github.com/anyproto
      GOTOOLCHAIN: local
    steps:
      - name: git config
        working-directory: .
        env:
          ANYTYPE_PAT: ${{ secrets.ANYTYPE_PAT }}
        run: |
          if [ -n "$ANYTYPE_PAT" ]; then
            git config --global url."https://${ANYTYPE_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: loom-heart/go.mod

      - name: Fetch tantivy lib
        run: scripts/fetch-tantivy.sh darwin-${{ matrix.arch }}

      # One arm64 runner builds both: clang cross-compiles the amd64 binary
      # (same as makefiles/ci-cross-compile-library.mk).
      - name: Build loom
        env:
          GOOS: darwin
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "1"
          CGO_CFLAGS: -mmacosx-version-min=11
          MACOSX_DEPLOYMENT_TARGET: "11.0"
          GOFLAGS: -buildvcs=false
        run: |
          go build \
            -tags="nographviz nowatchdog nosigar nomutexdeadlockdetector noheic" \
            -o loom ./cmd/loom

      - name: Smoke test
        run: |
          file loom
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            ./loom --help
          else
            # The runner is arm64; only check the architecture of the amd64 binary.
            file loom | grep -q x86_64
          fi

      - name: Package
        run: |
          name=loom-darwin-${{ matrix.arch }}
          tar -czf "$name.tar.gz" loom
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loom-darwin-${{ matrix.arch }}
          path: |
            loom-heart/loom-darwin-${{ matrix.arch }}.tar.gz
            loom-heart/loom-darwin-${{ matrix.arch }}.tar.gz.sha256

  build-windows:
    name: build (windows-amd64)
    runs-on: windows-2022
    defaults:
      run:
        working-directory: loom-heart
    env:
      GOPRIVATE: github.com/anyproto
      GOTOOLCHAIN: local
    steps:
      - name: git config
        shell: bash
        working-directory: .
        env:
          ANYTYPE_PAT: ${{ secrets.ANYTYPE_PAT }}
        run: |
          if [ -n "$ANYTYPE_PAT" ]; then
            git config --global url."https://${ANYTYPE_PAT}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: loom-heart/go.mod

      - name: Fetch tantivy lib
        shell: bash
        run: scripts/fetch-tantivy.sh windows-amd64

      # The prebuilt tantivy lib is a mingw (x86_64-pc-windows-gnu) static lib.
      - name: Install mingw-w64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Build loom
        shell: msys2 {0}
        env:
          CGO_ENABLED: "1"
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          GOFLAGS: -buildvcs=false
        run: |
          go build \
            -tags="nographviz nowatchdog nosigar nomutexdeadlockdetector noheic" \
            -ldflags="-linkmode external -extldflags=-static" \
            -o loom.exe ./cmd/loom

      - name: Smoke test
        shell: bash
        run: ./loom.exe --help

      - name: Package
        shell: bash
        run: |
          name=loom-windows-amd64
          powershell -NoProfile -Command "Compress-Archive -Path loom.exe -DestinationPath $name.zip"
          sha256sum "$name.zip" > "$name.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: loom-windows-amd64
          path: |
            loom-heart/loom-windows-amd64.zip
            loom-heart/loom-windows-amd64.zip.sha256

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/loom-v')
    needs: [build-linux, build-macos, build-windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
