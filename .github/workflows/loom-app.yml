name: loom app

# Builds the Loom desktop app (Electron + the loom-heart middleware helper) for
# Linux, macOS and Windows. Builds are UNSIGNED and NOT notarized: no signing
# secrets are used. The app's version comes from the release tag, and the update metadata
# (latest*.yml) is kept so installed copies can update from the GitHub release.
# Push a tag named loom-app-v<version> to attach the installers to a GitHub release.

on:
  workflow_dispatch:
  # Called by release.yml, which builds the app and the CLI for one release.
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (v0.1.2); the app is built as that version'
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'loom-app-v*'
    # Self-test: rebuild when the build recipe itself changes.
    branches:
      - develop
    paths:
      - '.github/workflows/loom-app.yml'
      - 'scripts/generate-protos.sh'
      - 'loom-heart/scripts/fetch-tantivy.sh'

permissions:
  contents: read

concurrency:
  group: loom-app-${{ github.ref }}
  cancel-in-progress: true

env:
  PROTOC_VERSION: '23.4'
  GOTOOLCHAIN: local

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            tantivy: linux-amd64-musl
            builder: --linux --x64
          - name: linux-arm64
            os: ubuntu-24.04-arm
            tantivy: linux-arm64-musl
            builder: --linux --arm64
          - name: macos-arm64
            os: macos-15
            tantivy: darwin-arm64
            builder: --macos --arm64
            mac_arch: arm64
          - name: macos-x64
            os: macos-15-intel
            tantivy: darwin-amd64
            builder: --macos --x64
            mac_arch: x64
          - name: windows-x64
            os: windows-2022
            tantivy: windows-amd64
            builder: --windows --x64
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 25.2.1

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version-file: loom-heart/go.mod

      # keytar needs libsecret; rpm/deb packaging needs rpmbuild and fpm. The fpm
      # bundled with electron-builder is x86_64 only, so arm64 uses a system one.
      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev rpm build-essential
          if [ "${{ matrix.name }}" = "linux-arm64" ]; then
            sudo apt-get install -y ruby ruby-dev
            sudo gem install --no-document fpm
            echo "USE_SYSTEM_FPM=true" >> "$GITHUB_ENV"
          fi

      # The prebuilt tantivy lib for Windows is a mingw (x86_64-pc-windows-gnu) static lib.
      - name: Install mingw-w64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: mingw-w64-x86_64-gcc

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              if [ "$(uname -m)" = "aarch64" ]; then ZIP="protoc-${PROTOC_VERSION}-linux-aarch_64.zip"; else ZIP="protoc-${PROTOC_VERSION}-linux-x86_64.zip"; fi ;;
            macOS)   ZIP="protoc-${PROTOC_VERSION}-osx-universal_binary.zip" ;;
            Windows) ZIP="protoc-${PROTOC_VERSION}-win64.zip" ;;
          esac
          DEST="$HOME/protoc"
          mkdir -p "$DEST"
          curl -fsSL -o "$DEST/protoc.zip" "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/${ZIP}"
          unzip -o "$DEST/protoc.zip" -d "$DEST"
          rm "$DEST/protoc.zip"
          echo "$DEST/bin" >> "$GITHUB_PATH"
          "$DEST/bin/protoc" --version

      - name: Install dependencies
        run: bun install

      - name: Fetch tantivy lib
        shell: bash
        working-directory: loom-heart
        run: scripts/fetch-tantivy.sh ${{ matrix.tantivy }}

      # The helper (dist/loomHelper) is the Go middleware the app talks to over gRPC.
      # Linux links the musl tantivy lib into a glibc binary (-Wl,--allow-multiple-definition
      # in ftsearch.go makes that work), exactly as `make build-server` does.
      - name: Build helper (Linux, macOS)
        if: runner.os != 'Windows'
        working-directory: loom-heart
        env:
          CGO_ENABLED: '1'
          CGO_CFLAGS: -Wno-deprecated-non-prototype -Wno-unknown-warning-option -Wno-deprecated-declarations -Wno-xor-used-as-pow -Wno-single-bit-bitfield-constant-conversion ${{ runner.os == 'macOS' && '-mmacosx-version-min=11' || '' }}
          MACOSX_DEPLOYMENT_TARGET: '11.0'
          GOFLAGS: -buildvcs=false
        run: |
          mkdir -p ../dist
          go build -tags "nosigar nowatchdog" -o ../dist/loomHelper ./cmd/grpcserver

      - name: Build helper (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        working-directory: loom-heart
        env:
          CGO_ENABLED: '1'
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          GOFLAGS: -buildvcs=false
        run: |
          mkdir -p ../dist
          go build -tags "nosigar nowatchdog noheic" \
            -ldflags "-linkmode external -extldflags=-static" \
            -o ../dist/loomHelper.exe ./cmd/grpcserver

      # Web clipper native messaging host (bun run build:nmh[-win]).
      - name: Build native messaging host
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            bun run build:nmh-win
          else
            bun run build:nmh
          fi

      # TypeScript protobuf bindings (middleware/) and the gRPC service registry.
      # SKIP_HEART_BUILD: the helper is built above, so only generate the bindings.
      - name: Generate protobuf bindings and bundled JSON
        shell: bash
        env:
          SKIP_HEART_BUILD: '1'
        run: |
          bash scripts/generate-protos.sh
          mkdir -p dist/lib/json/generated
          cp loom-heart/pkg/lib/bundle/system*.json loom-heart/pkg/lib/bundle/internal*.json dist/lib/json/generated/

      - name: Update locale
        run: bun run update:locale
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The app version drives auto-update: the updater compares it with the version in the release's
      # latest*.yml, so it has to be the release tag, not whatever package.json says.
      - name: Set app version from the release tag
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="$TAG"
          if [ -z "$tag" ] && [[ "$REF_NAME" == loom-app-v* ]]; then
            tag="${REF_NAME#loom-app-}"
          fi
          if [ -z "$tag" ]; then
            echo "No release tag: keeping the package.json version"
            exit 0
          fi
          version="${tag#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' is not v<major>.<minor>.<patch>"
            exit 1
          fi
          npm pkg set version="$version"
          echo "App version: $version"

      # Same steps as `bun run dist:*`, split so electron-builder can be told not to
      # sign, notarize or publish.
      - name: Build app
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          bun run build:electron
          bun run build:deps
          bunx vite build --config vite.config.ts

      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          ELECTRON_SKIP_NOTARIZE: '1'
          ELECTRON_SKIP_SENTRY: '1'
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          USE_HARD_LINKS: 'false'
        # The package.json mac.identity is the upstream team's signing identity; null skips signing.
        # package.json also lists both mac archs, which electron-builder builds whatever --arm64/--x64
        # says; each job only has its own native helper, so pin the arch (-c.mac.target.arch).
        run: bunx electron-builder ${{ matrix.builder }} --publish never -c.mac.identity=null -c.mac.target.arch=${{ matrix.mac_arch }}

      # The arm64 and x64 jobs both write latest-mac.yml; give each its own name so neither overwrites
      # the other. release.yml merges them back into one latest-mac.yml.
      - name: Name macOS update metadata per architecture
        if: runner.os == 'macOS'
        run: mv dist/latest-mac.yml dist/latest-mac.${{ matrix.mac_arch }}.yml

      - name: Package (Linux, Windows)
        if: runner.os != 'macOS'
        env:
          ELECTRON_SKIP_NOTARIZE: '1'
          ELECTRON_SKIP_SENTRY: '1'
          USE_HARD_LINKS: 'false'
        run: bunx electron-builder ${{ matrix.builder }} --publish never

      - name: List build output
        shell: bash
        run: ls -alh dist | head -50

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: loom-app-${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/*.dmg
            dist/*.zip
            dist/*.exe
            !dist/loomHelper.exe
            !dist/nativeMessagingHost.exe
            dist/*.blockmap
            dist/latest*.yml

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/loom-app-v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          generate_release_notes: true
          body: |
            Unsigned, non-notarized builds. On macOS, right-click the app and choose Open the first time;
            on Windows, SmartScreen will warn about an unknown publisher.
          files: dist/*
